name: Verification OCaml
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer OCaml
        run: sudo apt-get update && sudo apt-get install -y ocaml-nox make
      - name: Compiler et tester les exercices
        run: python3 tests/check.py
